server.port=8080

# Banco H2 salvo em arquivo (pasta data/), nao precisa instalar nada
spring.datasource.url=jdbc:h2:file:./data/cineviagens
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Mostra a mensagem dos erros no JSON (o front le o campo "message")
server.error.include-message=always

# Chave do JWT (minimo 32 caracteres) e validade em horas
app.jwt.secret=troque-esta-chave-por-uma-frase-bem-longa-123456
app.jwt.expiration-hours=24
